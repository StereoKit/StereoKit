name: Verify Compile
on: 
  workflow_dispatch:
  pull_request:
    branches:
    - master
    - develop

jobs:
  native-win32:
    runs-on: windows-latest
    env:
      CPM_SOURCE_CACHE: .deps_cache

    steps:
    - uses: actions/checkout@v4
    - uses: lukka/get-cmake@v3.26.3

    - name: Get Cache
      uses: actions/cache@v3
      with:
        key: DependencyCache
        path: |
          .deps_cache

    - name: Build Native Win32 x64
      run: |
        cmake --preset Win32_x64_Release
        cmake --build --preset Win32_x64_Release

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x

    - name: Install Mesa lavapipe (software Vulkan)
      shell: pwsh
      run: |
        $version = "26.0.7"
        $url = "https://github.com/pal1000/mesa-dist-win/releases/download/$version/mesa3d-$version-release-msvc.7z"
        Invoke-WebRequest -Uri $url -OutFile mesa.7z
        7z x mesa.7z -omesa -y
        $icd = (Get-ChildItem -Path mesa -Recurse -Filter "lvp_icd.x86_64.json" | Select-Object -First 1).FullName
        if (-not $icd) { throw "lavapipe ICD JSON not found in extracted archive" }
        $icdDir = Split-Path -Parent $icd
        Write-Host "Using ICD: $icd"
        Write-Host "ICD directory contents:"
        Get-ChildItem $icdDir | Format-Table Name, Length
        Write-Host "ICD JSON contents:"
        Get-Content $icd
        "VK_DRIVER_FILES=$icd"     >> $env:GITHUB_ENV
        "VK_ICD_FILENAMES=$icd"    >> $env:GITHUB_ENV
        "PATH=$icdDir;$env:PATH"   >> $env:GITHUB_ENV
        "VK_LOADER_DEBUG=all"      >> $env:GITHUB_ENV

    - name: Verify Vulkan Loader Sees lavapipe
      shell: pwsh
      run: |
        Write-Host "VK_DRIVER_FILES     = $env:VK_DRIVER_FILES"
        Write-Host "VK_ICD_FILENAMES    = $env:VK_ICD_FILENAMES"
        Write-Host "ICD JSON exists?    $([System.IO.File]::Exists($env:VK_DRIVER_FILES))"
        # Check that the loader DLL is present so we know which one we're hitting
        $loader = (Get-Command vulkan-1.dll -ErrorAction SilentlyContinue).Source
        if ($loader) { Write-Host "Vulkan loader found at: $loader" }
        else         { Write-Host "Vulkan loader (vulkan-1.dll) NOT on PATH" }

    - name: Run Tests
      working-directory: Examples/StereoKitTest
      run: dotnet run -c Release -- -headless -test

  native-macos:
    runs-on: macos-14
    env:
      CPM_SOURCE_CACHE: .deps_cache

    steps:
    - uses: actions/checkout@v4
    - uses: lukka/get-cmake@v3.26.3

    - name: Get Cache
      uses: actions/cache@v3
      with:
        key: DependencyCache
        path: |
          .deps_cache

    - name: Build Native macOS ARM64
      run: |
        cmake --preset MacOS_Arm64_Release
        cmake --build --preset MacOS_Arm64_Release

  native-linux-android-dotnet:
    runs-on: ubuntu-22.04
    env:
      CPM_SOURCE_CACHE: .deps_cache

    steps:
    - uses: actions/checkout@v4
    - uses: lukka/get-cmake@v3.26.3

    - name: Get Cache
      uses: actions/cache@v4
      with:
        key: DependencyCache
        path: |
          .deps_cache
    
    - name: Install Prerequisites
      run: |
        sudo apt-get update
        sudo apt-get install clang llvm lld ninja-build libx11-dev libxfixes-dev libxrandr-dev libxcursor-dev libfontconfig-dev

    - name: Build Native Linux x64
      run: |
        cmake --preset Linux_x64_Release
        cmake --build --preset Linux_x64_Release

    - name: Set up Android NDK
      uses: nttld/setup-ndk@v1.4.2
      id: setup-ndk
      with:
        ndk-version: r25c
        local-cache: true

    - name: Restore Android Symlinks
      run: |
        directory="${{ steps.setup-ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin"
        find "$directory" -type l | while read link; do
            current_target=$(readlink "$link")
            new_target="$directory/$(basename "$current_target")"
            ln -sf "$new_target" "$link"
            echo "Changed $(basename "$link") from $current_target to $new_target"
        done

    - name: Install Android SDK Platform
      run: echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-32"

    - name: Build Native Android ARM64
      run: |
        cmake --preset Android_Arm64_Release
        cmake --build --preset Android_Arm64_Release
      env:
        NDK: ${{ steps.setup-ndk.outputs.ndk-path }}

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with: 
        dotnet-version: 7.0.x

    - name: Build Sample Project
      run: dotnet build Examples/StereoKitTest/StereoKitTest.csproj -c Release
